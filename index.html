<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Привет</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #8ec5fc 0%, #e0c3fc 45%, #fef9ff 100%);
      font-family: "Segoe UI", "Inter", sans-serif;
    }

    h1 {
      margin: 0;
      padding: 1.2rem 2.4rem;
      font-size: clamp(2.4rem, 8vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #ff6ec4, #7873f5);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(120, 115, 245, 0.35), 0 6px 14px rgba(0, 0, 0, 0.12);
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
  </style>
</head>
<body>
  <h1>привет</h1>
</body>
</html>
